<!--
  OS-TABS — Exemple d'utilisation
  ═══════════════════════════════════════════════════

  À utiliser pour TOUTE commande de TP qui diffère selon l'OS.
  • L'onglet de l'OS du visiteur est sélectionné automatiquement.
  • Les autres OS restent accessibles via les onglets.

  RÈGLE DA :
  • Toujours dans une .card avec border-left (comme un code-block)
  • Ordre des onglets : macOS → Linux → Windows
  • data-os ∈ { mac, linux, windows } sur l'onglet ET son panneau
  • 1 seule commande logique par <pre class="code-block">
  • Si une commande est identique sur tous les OS, ne PAS utiliser os-tabs :
    un simple <pre class="code-block"> suffit.

  ───────────────────────────────────────────────────
  A) Commande d'installation différente selon l'OS
  ───────────────────────────────────────────────────
-->
<div class="card" style="border-left: 4px solid var(--color-blue);">
  <strong style="color: var(--color-blue);">Installer Node.js</strong>

  <div class="os-tabs" data-os-tabs style="margin-top: var(--margin-sm);">
    <div class="os-tabs__nav" role="tablist">
      <button class="os-tabs__tab" data-os="mac"     type="button">macOS</button>
      <button class="os-tabs__tab" data-os="linux"   type="button">Linux</button>
      <button class="os-tabs__tab" data-os="windows" type="button">Windows</button>
    </div>

    <div class="os-tabs__panel" data-os="mac">
      <pre class="code-block">brew install node</pre>
    </div>
    <div class="os-tabs__panel" data-os="linux">
      <pre class="code-block">sudo apt update &amp;&amp; sudo apt install -y nodejs npm</pre>
    </div>
    <div class="os-tabs__panel" data-os="windows">
      <pre class="code-block">winget install OpenJS.NodeJS</pre>
    </div>
  </div>
</div>
